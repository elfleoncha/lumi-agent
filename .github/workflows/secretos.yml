name: Revisión de secretos

on: [pull_request]

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar credenciales en el diff
        run: |
          # tokens de Discord / OpenAI / Groq y claves privadas en lo añadido
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+' \
             | grep -EI 'MT[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |)PRIVATE KEY'; then
            echo "::error::Hay algo con pinta de credencial en este PR"
            exit 1
          fi
          echo "ok"
