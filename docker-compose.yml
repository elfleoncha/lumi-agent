# Lumi con docker compose
#
#   1. cp .env.example .env    (y pon DEEPSEEK_API_KEY o la de tu proveedor)
#   2. docker compose up -d
#   3. abre http://localhost:4477 y rellena el formulario de primer arranque
#      (PIN, token de Discord, tu ID y nombre). Se guarda en ./data.
#
# Con navegador en vivo:  docker compose --profile navegador up -d
# HTTPS: deja tus certificados en ./certs-tls (o ./certs) y reinicia.
services:
  lumi:
    build: .
    container_name: lumi
    restart: unless-stopped
    ports:
      - "4477:4477"   # panel (http)
      - "4478:4478"   # panel (https), si hay certificados
    env_file:
      # Copia .env.example a .env y pon ahí DEEPSEEK_API_KEY (o la de tu proveedor)
      - path: .env
        required: false
    environment:
      # la configuración vive en el volumen ./data (el formulario la escribe ahí)
      LUMI_CONFIG: /data/config.json
      LUMI_SECRET: /data/secret.json
      LUMI_SESSION_DIR: /data/sessions
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./data:/data
      # Opcional: si prefieres las credenciales de pi en vez de variables de
      # entorno. Ojo: en un contenedor limpio lo más fiable es la variable.
      #- ${HOME}/.pi:/root/.pi:ro
      # datos: conversaciones, medios, ficheros servidos y ajustes
      - lumi-media:/app/media
      - lumi-uploads:/app/uploads
      - lumi-files:/app/public/files
      - ./certs-tls:/app/certs-tls:ro
      - ./certs:/app/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Navegador en vivo (opcional):  docker compose --profile navegador up -d
  lumi-browser:
    build: .
    image: lumi-agent
    container_name: lumi-browser
    restart: unless-stopped
    profiles: ["navegador"]
    command: ["/app/.venv/bin/python", "scripts/browser_live.py"]
    ports:
      - "4479:4479"
      - "4480:4480"
    environment:
      LUMI_SECRET: /data/secret.json
      BROWSER_LIVE_PORT: 4479
      BROWSER_LIVE_HTTPS_PORT: 4480
      BROWSER_LIVE_START: http://lumi:4477/
      BROWSER_LIVE_NO_SANDBOX: "1"
    volumes:
      - ./data:/data:ro
      - lumi-browser-profile:/app/.browser-profile
      - ./certs-tls:/app/certs-tls:ro
      - ./certs:/app/certs:ro

volumes:
  lumi-browser-profile:
  lumi-media:
  lumi-uploads:
  lumi-files:
