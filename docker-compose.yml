# Lumi con docker compose
#
#   1. cp config.example.json config.json && cp secret.example.json secret.json
#   2. edita los dos (tu ID de Discord, token, PIN, appName)
#   3. docker compose up -d
#
# El panel queda en http://localhost:4477 (y https en 4478 si tienes
# certificados en ./certs-tls o ./certs).
services:
  lumi:
    build: .
    container_name: lumi
    restart: unless-stopped
    ports:
      - "4477:4477"   # panel (http)
      - "4478:4478"   # panel (https), si hay certificados
    env_file:
      # Copia .env.example a .env y pon ahí DEEPSEEK_API_KEY (o la de tu proveedor)
      - path: .env
        required: false
    volumes:
      - ./config.json:/app/config.json:ro
      - ./secret.json:/app/secret.json:ro
      # Opcional: si prefieres las credenciales de pi en vez de variables de
      # entorno. Ojo: en un contenedor limpio lo más fiable es la variable.
      #- ${HOME}/.pi:/root/.pi:ro
      # datos: conversaciones, medios, ficheros servidos y ajustes
      - lumi-sessions:/app/sessions
      - lumi-media:/app/media
      - lumi-uploads:/app/uploads
      - lumi-files:/app/public/files
      - ./certs-tls:/app/certs-tls:ro
      - ./certs:/app/certs:ro
    environment:
      TZ: Europe/Madrid
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Navegador en vivo (opcional):  docker compose --profile navegador up -d
  lumi-browser:
    build: .
    image: lumi-agent
    container_name: lumi-browser
    restart: unless-stopped
    profiles: ["navegador"]
    command: ["/app/.venv/bin/python", "scripts/browser_live.py"]
    ports:
      - "4479:4479"
      - "4480:4480"
    environment:
      BROWSER_LIVE_PORT: 4479
      BROWSER_LIVE_HTTPS_PORT: 4480
      BROWSER_LIVE_START: http://lumi:4477/
      BROWSER_LIVE_NO_SANDBOX: "1"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./secret.json:/app/secret.json:ro
      - lumi-browser-profile:/app/.browser-profile
      - ./certs-tls:/app/certs-tls:ro
      - ./certs:/app/certs:ro

volumes:
  lumi-browser-profile:
  lumi-sessions:
  lumi-media:
  lumi-uploads:
  lumi-files:
